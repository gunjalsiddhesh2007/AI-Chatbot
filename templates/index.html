<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>AI ChatBot</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.11.1/styles/github.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script defer src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/highlight.js@11.11.1/lib/highlight.min.js"></script>
  <script defer src="{{ url_for('static', filename='js/script.js') }}"></script>
</head>
<body>
  <div id="app-shell" class="app-shell">
    <aside id="sidebar" class="sidebar" aria-label="Chat history">
      <div class="sidebar-brand-row">
        <a class="brand" href="/" aria-label="AI ChatBot home">
          <span class="brand-mark" aria-hidden="true">✦</span><span>AI ChatBot</span>
        </a>
        <button id="sidebar-close" class="icon-button sidebar-close" type="button" aria-label="Close sidebar">×</button>
      </div>
      <button id="new-chat-button" class="new-chat-button" type="button">
        <span aria-hidden="true">＋</span><span>New chat</span>
      </button>
      <label class="search-box" for="conversation-search">
        <span aria-hidden="true">⌕</span>
        <input id="conversation-search" type="search" placeholder="Search conversations" autocomplete="off">
      </label>
      <div class="history-heading"><span>Recent</span><span id="history-count" aria-live="polite"></span></div>
      <nav id="conversation-list" class="conversation-list" aria-label="Recent conversations"></nav>
      <div class="sidebar-footer"><span class="sidebar-footer-mark" aria-hidden="true">●</span> History saved on this server</div>
    </aside>
    <button id="sidebar-backdrop" class="sidebar-backdrop" type="button" aria-label="Close navigation" tabindex="-1"></button>

    <main class="main-panel">
      <header class="topbar">
        <div class="topbar-title-group">
          <button id="sidebar-toggle" class="icon-button sidebar-toggle" type="button" aria-label="Toggle sidebar" aria-expanded="true" aria-controls="sidebar">
            <span aria-hidden="true">☰</span>
          </button>
          <h1 id="active-title" class="active-title">New chat</h1>
        </div>
        <div class="status"><span class="status-dot" aria-hidden="true"></span><span>Ready to help</span></div>
      </header>

      <section class="conversation" aria-label="Chat conversation" aria-live="polite" aria-relevant="additions text">
        <div id="messages" class="messages">
          <div id="welcome" class="welcome">
            <div class="welcome-icon" aria-hidden="true">✦</div>
            <h2>Hello! How can I help you today?</h2>
            <p>Ask a question, explore an idea, or get help with a task.</p>
          </div>
        </div>
      </section>
      <div class="composer-wrap">
        <form id="chat-form" class="composer">
          <label class="sr-only" for="message-input">Your message</label>
          <textarea id="message-input" rows="1" maxlength="4000" placeholder="Message AI ChatBot…" required></textarea>
          <button id="send-button" class="send-button" type="submit" aria-label="Send message" title="Send message"><span aria-hidden="true">↑</span></button>
        </form>
        <div class="composer-meta">
          <button id="new-chat-inline" class="clear-button" type="button">New chat</button>
          <span>Enter to send · Shift + Enter for a new line</span>
        </div>
        <p class="disclaimer">AI can make mistakes. Check important information.</p>
      </div>
    </main>
    <template id="suggestion-cards-template">
      <section class="suggestions" aria-label="Suggested prompts">
        <h3>Try one of these</h3>
        <div class="suggestion-grid">
          <button class="suggestion-card" type="button" data-prompt="Explain quantum computing in simple terms, using a relatable analogy.">
            <strong>Explain a topic</strong><span>Make a complex idea easy to understand.</span>
          </button>
          <button class="suggestion-card" type="button" data-prompt="Give me a concise overview of climate change: its key causes, effects, and practical solutions.">
            <strong>Get quick facts</strong><span>Explore the essentials of a subject.</span>
          </button>
          <button class="suggestion-card" type="button" data-prompt="Help me write a concise, friendly email asking to schedule a meeting.">
            <strong>Write something</strong><span>Start a clear, polished draft.</span>
          </button>
          <button class="suggestion-card" type="button" data-prompt="Suggest five creative, low-cost weekend project ideas and explain how to start each one.">
            <strong>Explore ideas</strong><span>Brainstorm options and next steps.</span>
          </button>
        </div>
      </section>
    </template>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </div>
</body>
</html>
